apply plugin: 'com.android.application'

android {
    namespace "com.smartcar.notify"

    compileSdkVersion 36

    defaultConfig {
        applicationId "com.smartcar.notify"
        minSdk 28
        // 30, not 31: from 31 on, a foreground-service start from the background (the request
        // receiver woken by a client) is refused. The audience is Android 9–12 head units, and the
        // app is not on Google Play.
        targetSdkVersion 30
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName

        setProperty("archivesBaseName", "car-notification-service-${versionName}")
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('../keystore.jks')
            storePassword System.getenv("KEY_PASSWORD")
            keyAlias "key0"
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material

    testImplementation 'junit:junit:4.13.2'
}
